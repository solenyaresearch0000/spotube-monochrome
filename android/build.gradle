allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    // flutter_new_pipe_extractor pins NewPipeExtractor to a loose commit
    // (e4e5ccc1...) that jitpack builds but publishes with zero modules, so it
    // 404s at resolve time. Redirect to the nearest properly-published release
    // tag. The group case matters: jitpack serves the multi-module submodules
    // (extractor, timeago-parser) only under the canonical 'TeamNewPipe' case,
    // so substitute to that exact coordinate (not the lowercase declared one).
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.github.teamnewpipe:NewPipeExtractor') using module('com.github.TeamNewPipe:NewPipeExtractor:v0.24.3')
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}